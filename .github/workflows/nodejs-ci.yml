name: Node.js CI and Docker Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-docker:
    name: Node.js tests and Docker runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-lifecycle-demo:ci .

      - name: Run container and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name devops-lifecycle-demo-ci -p 3000:3000 devops-lifecycle-demo:ci
          cleanup() {
            docker logs devops-lifecycle-demo-ci || true
            docker rm -f devops-lifecycle-demo-ci || true
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not become ready."
          exit 1
