name: Jenkinsfile Runner Pipeline Execution

on:
  push:
    branches: [main]
    paths:
      - 'Jenkinsfile'
      - 'plugins.txt'
      - '.github/workflows/jenkinsfile-runner.yml'
      - 'server.js'
      - 'server.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
  pull_request:
    branches: [main]
    paths:
      - 'Jenkinsfile'
      - 'plugins.txt'
      - '.github/workflows/jenkinsfile-runner.yml'
      - 'server.js'
      - 'server.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jenkins-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Docker engine
        run: docker info

      - name: Download Jenkins LTS, Jenkinsfile Runner and plugin manager
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jenkins/jenkins jenkins/plugins jenkins/jenkinsfile-runner
          curl --location --fail --retry 3 \
            https://updates.jenkins.io/download/war/2.580.2/jenkins.war \
            --output jenkins/jenkins.war
          unzip -q jenkins/jenkins.war -d jenkins/jenkins
          curl --location --fail --retry 3 \
            https://github.com/jenkinsci/jenkinsfile-runner/releases/download/1.0-beta-32/jenkinsfile-runner-1.0-beta-32.zip \
            --output jenkins/jenkinsfile-runner.zip
          unzip -q jenkins/jenkinsfile-runner.zip -d jenkins/jenkinsfile-runner
          chmod +x jenkins/jenkinsfile-runner/bin/jenkinsfile-runner
          curl --location --fail --retry 3 \
            https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/2.16.0/jenkins-plugin-manager-2.16.0.jar \
            --output jenkins/jenkins-plugin-manager.jar
          mkdir -p jenkins/jenkins/WEB-INF/groovy.init.d jenkins/casc
          cat > jenkins/jenkins/WEB-INF/groovy.init.d/refresh-update-center.groovy <<'GROOVY'
          import hudson.model.DownloadService
          println 'Refreshing Jenkins plugin metadata'
          for (d in DownloadService.Downloadable.all()) {
              d.updateNow()
          }
          GROOVY
          echo "JENKINS_ROOT=./jenkins" >> "$GITHUB_ENV"

      - name: Install Jenkins Pipeline and Git plugins
        shell: bash
        run: |
          set -euo pipefail
          java -jar jenkins/jenkins-plugin-manager.jar \
            --war jenkins/jenkins.war \
            --plugin-file plugins.txt \
            --plugin-download-directory=jenkins/plugins

      - name: Execute the repository Jenkinsfile
        uses: jenkinsci/jfr-runtime-action@master
        with:
          command: run
          jenkinsfile: Jenkinsfile
