name: Jenkinsfile Syntax Validation

on:
  push:
    branches: [main]
    paths:
      - 'Jenkinsfile'
      - '.github/workflows/jenkinsfile-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Jenkinsfile'
      - '.github/workflows/jenkinsfile-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groovy-parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Groovy
        run: |
          sudo apt-get update
          sudo apt-get install --yes groovy

      - name: Parse Jenkinsfile as Groovy
        run: |
          groovy -e "new GroovyShell().parse(new File('Jenkinsfile')); println 'Jenkinsfile Groovy syntax: PASS'"
